<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#031512">
<title>Download 91 APK</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
  radial-gradient(circle at top,#10472b,transparent 45%),
  linear-gradient(145deg,#020b06,#031512,#020b12);
}

.container{
  width:100%;
  max-width:440px;
  padding:22px;
  text-align:center;
  border-radius:26px;
  border:1px solid rgba(34,197,94,.4);
  background:rgba(4,25,15,.94);
  box-shadow:0 15px 60px #0009,0 0 30px #22c55e20;
  animation:show .7s ease;
}

@keyframes show{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}

.badge{
  display:inline-block;
  padding:8px 15px;
  margin-bottom:16px;
  border-radius:30px;
  background:#22c55e18;
  border:1px solid #22c55e70;
  color:#9cf5b7;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1.5px;
}

/* VIDEO SECTION */
.video-box{
  width:100%;
  overflow:hidden;
  position:relative;
  border-radius:18px;
  border:1px solid #22c55e80;
  background:#000;
  box-shadow:0 0 25px #22c55e20;
  margin-bottom:23px;
}

.video-box video{
  display:block;
  width:100%;
  max-height:420px;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#000;
}

.video-label{
  padding:10px;
  color:#b5f7c7;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  background:#07170d;
}

/* LOGO */
.logo{
  width:105px;
  height:105px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:3px solid #fff;
  outline:3px solid #22c55e80;
  background:linear-gradient(135deg,#14532d,#052e16);
  box-shadow:0 0 30px #22c55e55;
  overflow:hidden;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logo span{
  font-size:42px;
  font-weight:900;
  color:#4ade80;
}

h1{
  font-size:29px;
  font-weight:900;
  margin-bottom:12px;
  overflow-wrap:anywhere;
  background:linear-gradient(90deg,#fff,#4ade80);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.description{
  font-size:14px;
  color:#a7c8b3;
  line-height:1.7;
  margin-bottom:22px;
}

/* DOWNLOAD BUTTON */
#downloadBtn{
  width:100%;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:16px;
  border-radius:16px;
  text-decoration:none;
  color:#fff;
  font-size:17px;
  font-weight:900;
  background:linear-gradient(100deg,#22c55e,#16833f);
  border:1px solid #9cf5b7;
  box-shadow:0 10px 30px #22c55e35;
  transition:.2s;
  cursor:pointer;
}

#downloadBtn:active{transform:scale(.97)}
#downloadBtn.loading{opacity:.7;pointer-events:none}

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:20px;
}

.feature{
  padding:13px 4px;
  border:1px solid #22c55e35;
  border-radius:13px;
  background:#ffffff06;
}

.feature b{
  display:block;
  color:#4ade80;
  font-size:13px;
  margin-bottom:5px;
}

.feature span{
  color:#8aa999;
  font-size:9px;
  font-weight:bold;
}

.footer{
  border-top:1px solid #ffffff15;
  margin-top:20px;
  padding-top:15px;
  color:#8aa999;
  font-size:11px;
  line-height:1.7;
}

@media(max-width:380px){
  .container{padding:17px}
  h1{font-size:25px}
  #downloadBtn{font-size:15px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
}
</style>
</head>

<body>

<main class="container">

  <div class="badge">▶ OFFICIAL APP DOWNLOAD</div>

  <!-- VIDEO: Replace YOUR_VIDEO_URL.mp4 with your video URL -->
  <div class="video-box">
    <video
      controls
      playsinline
      preload="metadata"
      poster="YOUR_VIDEO_POSTER_URL.jpg">
      <source src="YOUR_VIDEO_URL.mp4" type="video/mp4">
      Your browser does not support HTML video.
    </video>
    <div class="video-label">▶ WATCH VIDEO & DOWNLOAD</div>
  </div>

  <!-- LOGO -->
  <div class="logo">
    <span>D</span>
    <!-- Optional logo image:
    <img src="YOUR_LOGO_URL.jpg" alt="App Logo"
         onerror="this.remove()">
    -->
  </div>

  <h1>DOWNLOAD 91 APK</h1>

  <p class="description">
    Watch the video above and download the app using the button below.
  </p>

  <!-- Replace /download with your actual download URL -->
  <a id="downloadBtn" href="/download">
    <svg width="25" height="25" viewBox="0 0 24 24"
         fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"/>
      <path d="m7 10 5 5 5-5"/>
      <path d="M5 20h14"/>
    </svg>
    <span>DOWNLOAD APK</span>
  </a>

  <div class="features">
    <div class="feature">
      <b>ANDROID</b>
      <span>COMPATIBLE</span>
    </div>
    <div class="feature">
      <b>15.7 MB</b>
      <span>APP SIZE</span>
    </div>
    <div class="feature">
      <b>1 TAP</b>
      <span>DOWNLOAD</span>
    </div>
  </div>

  <div class="footer">
    Only install APK files from sources you trust.
    Review the app's permissions before installing.
  </div>

</main>

<script>
(function(){
  const button = document.getElementById('downloadBtn');

  // Set this to your actual APK download URL.
  const DOWNLOAD_URL = '/download';

  button.href = DOWNLOAD_URL;

  button.addEventListener('click', function(event){
    if (!DOWNLOAD_URL || DOWNLOAD_URL === '#') {
      event.preventDefault();
      return;
    }

    button.classList.add('loading');
    button.querySelector('span').textContent = 'OPENING DOWNLOAD...';

    // Normal navigation to the supplied download URL.
    // No automatic redirect or simulated click events.
  });
})();
</script>

</body>
</html>
